# TasteLink 前端容器 nginx 配置：静态资源 + SPA 回退 + 后端 API 同源反代
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;          # 匹配后端 multipart max-request-size(20MB)

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API（同源，规避跨域；backend 为 compose 服务名）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # 后端 local 存储图片路径转给后端（若 STORAGE_PUBLIC_BASE_URL 指向浏览器可达后端则直连，此处仅同源兜底）
    location /static/uploads/ {
        proxy_pass http://backend:8080;
    }
}
