# =====================================================================
# TasteLink 后端配置（提交版：仅含占位符与环境变量引用，无真实凭据）
# 真实 DB 口令 / OSS AK/SK / JWT 密钥 / Redis 密码 请写入 application-local.yml（已 gitignore）
# 或通过环境变量注入，切勿直接回填本文件。
# =====================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # 默认激活 local profile；真实 DB 口令 / OSS AK/SK / JWT 密钥写入
  # application-local.yml（已 gitignore），覆盖下方占位符。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: tastelink-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tastelink}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # B4-5：minimum-idle 提至与 max 同量级，避免突发流量时从 2 条起步建连的毛刺
      minimum-idle: 10
      connection-timeout: 20000
      # B4-5：local 下开启泄露检测，连接被借出超 30s 未归还即记 warn 便于定位长事务/IO 泄漏
      # 部署环境按需经 LEAK_DETECTION_THRESHOLD 关闭或调高（0=关闭）
      leak-detection-threshold: ${LEAK_DETECTION_THRESHOLD:30000}
  # Redis（v2 Phase A 点评审热度排行缓存；Lettuce 懒连接，未起 Redis 不影响启动）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2000ms
  # RabbitMQ（v2 Phase C 店铺删除延时清理；AMQP 连接懒初始化，
  # 未起 broker 不影响应用启动，仅删店后台路径降级为对账调度直接清理）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated   # ConfirmCallback 记 nack，靠对账补
    publisher-returns: true              # ReturnsCallback 记路由失败
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false   # 重试耗尽后不回原队列，交由 cleanup-queue 的 x-dead-letter-exchange 路由进 DLQ
        retry:
          enabled: true                   # Spring AMQP 内置重试，耗尽后 reject→DLX→DLQ
          max-attempts: ${RABBIT_RETRY_MAX_ATTEMPTS:3}
          initial-interval: 1000ms
          multiplier: 2.0
  # Elasticsearch（v2 Phase D 店铺关键词检索；SR RestClient 懒初始化，未起 ES 不影响启动，
  # 仅 keyword 检索降级回 MySQL LIKE）
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 10s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 不自动执行 SQL 脚本（建表与种子数据由运维手动执行 docs/db 下的脚本）
  sql:
    init:
      mode: never
  # B4-3 调度加固：scheduling 线程池提至 3，让 rank-rebuild / shop-cleanup-reconcile /
  # shop-index-reconcile 三个 @Scheduled 不再单线程串行（避免长任务阻塞其他 cron）
  task:
    scheduling:
      pool:
        size: 3

# B4-1 actuator：仅暴露 health（permitAll）与 metrics（ADMIN），其余端点关闭
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never   # 不向前端泄露组件详情（DB/Redis/MQ 状态）

# B4-2 traceId：日志 pattern 加 [%X{traceId}]，由 TraceIdFilter 注入 MDC
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 注意：MVP 不全局开启逻辑删除；status 字段由业务按需过滤，故不设置 logic-delete-field。

# =====================================================================
# TasteLink 业务配置
# =====================================================================
tastelink:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-string-of-at-least-32-chars}
    expire-seconds: 86400
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    # local | oss | cos；默认 local 兜底，避免无对象存储凭据时无法联调
    type: ${STORAGE_TYPE:local}
    local:
      base-path: ${STORAGE_LOCAL_PATH:./data/uploads}
      url-prefix: /static/uploads
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      access-key-id: ${OSS_AK:}
      access-key-secret: ${OSS_SK:}
      bucket: ${OSS_BUCKET:}
      domain: ${OSS_DOMAIN:}   # 自定义访问域名；为空则用 https://{bucket}.{endpoint}
    # 腾讯云 COS（type=cos 时生效）；凭据建议用子账号密钥，仅授权该 bucket 读写
    cos:
      # 务必与 CVM 同地域：默认域名在同地域内会自动解析到内网，流量不计费
      region: ${COS_REGION:ap-shanghai}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      bucket: ${COS_BUCKET:}
      # 自定义访问域名（CDN / 自有域名）；为空则用 https://{bucket}.cos.{region}.myqcloud.com
      domain: ${COS_DOMAIN:}
  # v2 Phase A：点评审热度排行缓存（Redis ZSet）
  rank:
    # 缓存总开关；关闭后读写均回退 MySQL，便于灰度/回滚
    cache-enabled: ${RANK_CACHE_ENABLED:true}
    # 全局热度 ZSet 的 key 后缀（B4-4：完整 key = tastelink:{profile}:review:hot，
    # 由 HotRankServiceImpl 经 RedisKeyNamespace 加环境前缀，防多环境共用 Redis 串数据）
    zset-key: ${RANK_ZSET_KEY:review:hot}
    # 定时对账：以 MySQL 为准重建全局 ZSet（修复漂移 + 冷启动空缓存）
    rebuild-cron: ${RANK_REBUILD_CRON:0 */10 * * * *}
    # 重建时保留的 TopN 条数（避免 ZSet 无限增长）
    rebuild-top-size: ${RANK_REBUILD_TOP_SIZE:200}
  # v2 Phase C：店铺删除延时清理（RabbitMQ，TTL + DLX 免插件方案）
  rabbitmq:
    # 总开关；关闭后删店 afterCommit 不发消息，改由对账调度直接物理清理（无延时窗口）
    enabled: ${RABBIT_ENABLED:true}
    # 延时窗口（「撤销误删」缓冲）；用作 delay-queue 的 x-message-ttl，固定值无 TTL 排序坑
    cleanup-delay-ms: ${RABBIT_CLEANUP_DELAY_MS:5000}
    # 滞留店对账：扫 status=0 且 update_time 已超 delay+grace 的店铺重清/重发
    reconcile-cron: ${RABBIT_CLEANUP_RECON_CRON:0 */2 * * * *}
    reconcile-grace-ms: ${RABBIT_CLEANUP_RECON_GRACE_MS:30000}
    retry-max-attempts: ${RABBIT_RETRY_MAX_ATTEMPTS:3}
  # v2 Phase D：店铺关键词 ES 检索（Canal 增量同步延后，infra 待办 B；此处以定时全量重建兜底同步）
  search:
    # 总开关；关闭后 keyword 直接回退 MySQL LIKE，应用免连 ES 也能启动
    enabled: ${SEARCH_ENABLED:true}
    # 定时全量重建：以 MySQL status=1 店铺为准重灌 ES（修复漂移 + Canal 未到位时的唯一同步）
    rebuild-cron: ${SEARCH_REBUILD_CRON:0 */10 * * * *}
  # B5：XXL-JOB 调度中心接管三个对账/重建定时任务的触发（可视化调度 + 多实例路由 + 执行日志）
  xxl-job:
    # 总开关。默认 false：不创建执行器、不绑端口、仍走 @Scheduled + ShedLock（与引入前行为一致）。
    # 置 true 后 cron 改由 admin 侧配置，本地 yml 的 *-cron 不再决定触发时机
    enabled: ${XXL_JOB_ENABLED:false}
    # 调度中心地址；多个用逗号分隔。本地默认对应 docker-compose.yml 的 xxl-job-admin（:8888）
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8888/xxl-job-admin}
    # 通信令牌，须与 admin 的 xxl.job.accessToken 一致；生产务必替换掉默认值
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      # 执行器注册名，须与 admin「执行器管理」里的 AppName 一致，否则不会派发任务
      appname: ${XXL_JOB_EXECUTOR_APPNAME:tastelink-executor}
      # 注册地址（形如 http://host:port/）与网卡 IP；留空自动推导。容器内多网卡/跨网络时须显式指定
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      # 执行器端口（承载 admin 的任务回调）；容器部署须保证 admin 能直连该端口
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      log-path: ${XXL_JOB_EXECUTOR_LOG_PATH:./logs/xxl-job/jobhandler}
      log-retention-days: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
